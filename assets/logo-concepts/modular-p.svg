<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">PuYuan modular P mark concept</title>
  <desc id="desc">A geometric P formed from modular bars around a source point.</desc>
  <rect width="720" height="520" fill="#0A0A0B"/>
  <g fill="#00E5A0">
    <rect x="275" y="140" width="22" height="170" rx="11"/>
    <rect x="275" y="140" width="92" height="22" rx="11"/>
    <rect x="345" y="140" width="22" height="96" rx="11"/>
    <rect x="275" y="214" width="78" height="22" rx="11"/>
    <circle cx="287" cy="225" r="9" fill="#0A0A0B"/>
  </g>
  <circle cx="287" cy="225" r="4" fill="#00E5A0"/>
  <text x="360" y="440" fill="#F5F5F7" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="8">PUYUAN</text>
</svg>
