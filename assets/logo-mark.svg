<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="溥源科技 logo">
  <!-- 涟漪环:知识由源点向外扩散 -->
  <circle cx="32" cy="32" r="25" stroke="#00E5A0" stroke-width="1.5" opacity="0.28"/>
  <circle cx="32" cy="32" r="18" stroke="#00E5A0" stroke-width="1.75" opacity="0.55"/>
  <circle cx="32" cy="32" r="11" stroke="#00E5A0" stroke-width="2"  opacity="0.9"/>
  <!-- 连接线:源点 → agent 节点 -->
  <line x1="32" y1="32" x2="49.7" y2="14.3" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
  <!-- 源点 -->
  <circle cx="32" cy="32" r="4.5" fill="#00E5A0"/>
  <!-- agent 卫星节点 -->
  <circle cx="49.7" cy="14.3" r="3.5" fill="#00E5A0"/>
</svg>
